<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Form Input Bahan Makanan</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#19e65e",
            "background-light": "#f6f8f6",
            "background-dark": "#112116",
          },
          fontFamily: {
            "display": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
        },
      },
    }
  </script>
<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-gray-800 dark:text-gray-200">
<div class="relative flex min-h-screen w-full flex-col items-center justify-center p-4 sm:p-6 lg:p-8">
<div class="w-full max-w-2xl rounded-xl bg-white dark:bg-gray-900/50 shadow-lg ring-1 ring-black/5">
<div class="flex flex-col gap-6 p-6 sm:p-8">
<!-- PageHeading -->
<div class="flex flex-wrap justify-between gap-3">
<div class="flex flex-col gap-1">
<h1 class="text-gray-900 dark:text-white text-3xl font-bold leading-tight tracking-tight">Input Bahan Makanan</h1>
<p class="text-gray-500 dark:text-gray-400 text-base font-normal leading-normal">Tambahkan item baru untuk memantau tanggal kedaluwarsanya.</p>
</div>
</div>
<!-- Form Fields -->
<div class="flex flex-col gap-6">
<!-- Nama Bahan Makanan -->
<label class="flex flex-col w-full">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Nama Bahan Makanan</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="Contoh: Daging Sapi" value=""/>
</label>
<!-- Jumlah & Satuan -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Jumlah</p>
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="Contoh: 500" type="number" value=""/>
</label>
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Satuan</p>
<div class="relative w-full">
<select class="form-select appearance-none flex w-full min-w-0 flex-1 overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-12 p-3 text-base font-normal leading-normal">
<option>kg</option>
<option>gram</option>
<option>pcs</option>
<option>liter</option>
<option>ml</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-gray-500 dark:text-gray-400">
<span class="material-symbols-outlined text-base">expand_more</span>
</div>
</div>
</label>
</div>
<!-- Tanggal Pembelian & Kedaluwarsa -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Tanggal Pembelian</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="Pilih tanggal" type="date"/>
</div>
</label>
<label class="flex flex-col">
<p class="text-gray-900 dark:text-white text-sm font-medium leading-normal pb-2">Tanggal Kedaluwarsa</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-lg text-gray-900 dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark focus:border-primary h-12 placeholder:text-gray-400 dark:placeholder:text-gray-500 p-3 text-base font-normal leading-normal" placeholder="Pilih tanggal" type="date"/>
</div>
</label>
</div>
<!-- Kategori -->
<div class="flex flex-col gap-3">
<h2 class="text-gray-900 dark:text-white text-sm font-medium leading-tight">Kategori</h2>
<div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Daging</span>
</label>
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Sayuran</span>
</label>
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Buah</span>
</label>
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Susu</span>
</label>
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Roti</span>
</label>
<label class="flex cursor-pointer items-center gap-2 rounded-lg border border-gray-300 dark:border-gray-700 bg-background-light dark:bg-background-dark p-3 has-[:checked]:bg-primary/20 has-[:checked]:border-primary dark:has-[:checked]:border-primary/70">
<input class="form-radio h-4 w-4 border-gray-400 dark:border-gray-600 bg-transparent text-primary focus:ring-primary/50" name="category" type="radio"/>
<span class="text-gray-800 dark:text-gray-200 text-sm font-medium">Lainnya</span>
</label>
</div>
</div>
</div>
<!-- Action Buttons -->
<div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-3 pt-4">
<button class="flex items-center justify-center whitespace-nowrap h-11 px-6 rounded-lg bg-gray-200/80 dark:bg-gray-700/50 text-sm font-semibold text-gray-800 dark:text-gray-200 transition-colors hover:bg-gray-300/80 dark:hover:bg-gray-600/50">Batal</button>
<button class="flex items-center justify-center whitespace-nowrap h-11 px-6 rounded-lg bg-primary text-sm font-semibold text-black transition-transform hover:scale-105 active:scale-95">Simpan</button>
</div>
</div>
</div>
</div>
</body></html>
